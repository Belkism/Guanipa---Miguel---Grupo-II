<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protectium App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/carrito.css">
    <link rel="icon" href="./favicon1.jpg" type="image/png">
</head>
<body>

    <header>
        <nav class="nav">
            <div class="contenedor">
                <div class="contenedor-logo">
                    <button id="btnLogo" onclick="volverAInicio()">
                        <img src="./favicon2.jpg" alt="logoEmpresa">
                    </button>   
                    <div class="texto-logo">
                        <span class="titulo-app">Protectium App</span>
                        <span class="subtitulo-app">Licencias originales, seguridad garantizada</span>
                    </div>
                </div>
                  
                <ul class="menu">
                    <li><a class="linkProductos" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="linkLogin" href="login.html">Login Admin</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
    <main  class="my-5">
        <section class="seccion-carrito">

            <div id="contenedor-carrito">

            </div>
            <div id="total-carrito" class="text-end mt-4">

            </div>

        </section>

        <section>
            <div id="modal-confirmacion" class="modal-oculto">
                <div class="modal-contenido">
                    <h4>Confirmar compra</h4>
                    <p>¿Desea confirmar la compra?</p>
                    <div class="d-flex justify-content-end gap-2">
                        <button class="btn btn-secondary"
                            onclick="cancelarCompra()">
                            Cancelar
                        </button>
                        <button class="btn btn-success"
                            onclick="confirmarCompra()">
                            Confirmar
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>
    
    <script src="./js/carrito.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   
</body>
</html>
