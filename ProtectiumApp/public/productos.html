<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protectium App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/productos.css">
    <link rel="icon" href="./favicon1.jpg" type="image/png">
</head>
<body>

    <header>
        <nav class="nav">
            <div class="contenedor">
                <div class="contenedor-logo">
                    <button onclick="volverAInicio()">
                        <img src="./favicon2.jpg" alt="logoEmpresa">
                    </button>   
                    <div class="texto-logo">
                        <span class="titulo-app">Protectium App</span>
                        <span class="subtitulo-app">Licencias originales, seguridad garantizada</span>
                    </div>
                </div>
                  
                <ul class="menu">
                    <li class="dropdown">
                        <button id="btnMenu">Categorías</button>
                        <ul class="submenu">
                            <li><button id="btnSeguridad" data-categoria="seguridad">Seguridad</button></li>
                            <li><button id="btnProductividad" data-categoria="productividad">Productividad</button></li>
                        </ul>
                    </li>
                    <li><a class="linkCarrito" href="carrito.html">Carrito</a></li>
                    <li class="nav-item"><a class="linkLogin" href="login.html">Login Admin</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
    <main class="container my-5">
        <section class="categoria-section mb-5">
            <h2 class="text-center mb-4">Seleccione una categoría y conozca nuestros productos</h2>
            <div id="Seguridad" class="row justify-content-center g-4">
                <div class="col-md-4">
                    <div class="card categoria-card h-100 text-center"
                        data-categoria="seguridad">
                        <div class="card-body">
                            <h3 class="card-title text-info">
                                Seguridad
                            </h3>
                            <p class="card-text">
                                Antivirus, VPN, Firewall y soluciones de protección.
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card categoria-card h-100 text-center"
                        data-categoria="productividad">
                        <div class="card-body">
                            <h3 class="card-title text-warning">
                                Productividad
                            </h3>
                            <p class="card-text">
                                Office, Teams, OneDrive y herramientas de trabajo.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    
        <section class="categoria-section mb-5 oculto">
            <h2 class="mb-4 text-info">Seguridad</h2>
            <div id="contenedorSeguridad"></div> 
            <div id="paginacionSeguridad" class="mt-3"></div>
        </section>

        <section class="categoria-section mb-5 oculto">
            <h2 class="mb-4 text-warning">Productividad</h2>
            <div id="contenedorProductividad"></div>
            <div id="paginacionProductividad" class="mt-3"></div>
        </section>

    </main>
    
    <script src="./js/productos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   
</body>
</html>
