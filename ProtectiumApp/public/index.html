<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/tema.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./favicon1.jpg" type="image/png">
</head>
<body>

    <div class="card text-center mb-5" style="width: 25rem;">
        <div class="card-body p-4">
            <div class="text-center mb-3">
                    <img
                        src="/favicon2.jpg"
                        alt="Protectium"
                        class="img-fluid"
                        style="max-width: 90px;">
            </div>
            <h3 class="text-center mb-1">
                PROTECTIUM APP
            </h3>
            <h4 class="card-text" >
                Bienvenido
            </h4>
            <p class="text-center mb-2">
                Ingresá tu nombre para comenzar
            </p>

            <input type="text" 
                    id="nombre" 
                    placeholder="Ej: Juan Pérez"
                    autocomplete="off">
            <p id="aviso"></p>
            <button 
                class="btn btn-primary" 
                id="btnContinuar">
                Continuar
            </button> 
            <button 
                class="btn btn-outline-secondary" 
                id="btnLoginAdmin">
                Admin
            </button> 
            
        </div>
    </div>

    <footer>
        <small>
            TP-Belkis Guanipa - Lujan Miguel
        </small>
        <button id="temaBtn" class="tema-btn">
            <span id="temaText">Tema</span>
        </button>
    </footer>
    
    <script src="./js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/js/tema.js"></script>
    
</body>
</html>
