<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket</title>
    
    <link rel="stylesheet" href="./css/ticket.css" />
  </head>
  <body>
    <h1>Ticket de la compra</h1>
    <p>Número de ticket: <span id="idticket">-</span></p>
    <p>Fecha: <span id="fechaCompra">-</span></p>
    <p>Nombre del cliente: <span id="cliente">-</span></p>
    <p>Medio de pago: <span id="medioPago">-</span></p>
    <p><strong>Total de la compra: $ <span id="totalCompra">0</span></strong></p>

    <table>
    <thead>
        <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio</th>
        <th>Subtotal</th>
        </tr>
    </thead>
    <tbody id="tablaProductos"></tbody>
    </table>

    <div class="actions">
  <a id="descargarLink" class="hidden" href="#" download>Descargar Ticket</a>
  <button id="btnLogo" onclick="volverAInicio()"> Inicio</button>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const ids = params.get("ids");

    const formatoFecha = (valor) => {
        const fecha = new Date(valor);
        return Number.isNaN(fecha.getTime()) ? valor : fecha.toLocaleString();
    };

    window.volverAInicio = () => {
      sessionStorage.clear();
      window.location.href = "/";
    };

    const cargarTicket = async () => {
        try {
        const query = ids ? `?ids=${encodeURIComponent(ids)}` : "";
        const res = await fetch(`/ticket/data${query}`);
        if (!res.ok) {
            throw new Error("No se pudo cargar el ticket");
        }

        const ticket = await res.json();

        document.getElementById("idticket").textContent = ticket.idticket;
        document.getElementById("fechaCompra").textContent = formatoFecha(ticket.fechaCompra);
        document.getElementById("cliente").textContent = ticket.cliente || "No disponible";
        document.getElementById("medioPago").textContent = ticket.medioPago || "No disponible";
        let totalRender = Number(ticket.totalCompra) || 0;

        const tbody = document.getElementById("tablaProductos");
        tbody.innerHTML = "";

        (ticket.productos || []).forEach((producto) => {
            const tr = document.createElement("tr");
          const precio = Number(producto.precio) || 0;
          const cantidad = Number(producto.cantidad) || 0;
          const total = Number(producto.total) || (precio * cantidad);
            totalRender += total;
            tr.innerHTML = `
            <td>${producto.nombre}</td>
          <td>${cantidad}</td>
          <td>${precio}</td>
          <td>${total}</td>
            `;
            tbody.appendChild(tr);
        });

        if ((Number(ticket.totalCompra) || 0) > 0) {
            totalRender = Number(ticket.totalCompra);
        }
        document.getElementById("totalCompra").textContent = totalRender;

        const link = document.getElementById("descargarLink");
        link.href = `/ticket/pdf?ids=${ticket.idticket}`;
        link.classList.remove("hidden");
        } catch (error) {
        document.body.insertAdjacentHTML("beforeend", `<p>${error.message}</p>`);
        }
    };

    cargarTicket();
    </script>
      
</body>
</html>
